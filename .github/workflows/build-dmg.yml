name: Build DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Apply macOS 14 patch
        run: git apply compositor-macos14.patch

      - name: Build (tries 14.0, then 15.0, then 15.4)
        run: |
          for T in 14.0 15.0 15.4; do
            echo "=================== Trying deployment target $T ==================="
            rm -rf build
            if xcodebuild -project Compositor.xcodeproj \
                 -scheme Compositor \
                 -configuration Release \
                 -derivedDataPath build \
                 ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
                 MACOSX_DEPLOYMENT_TARGET=$T \
                 CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
                 build > build-$T.log 2>&1; then
              echo "SUCCESS with $T"
              echo "$T" > target.txt
              break
            else
              echo "FAILED with $T. Key lines:"
              grep -E "error:|While running pass|While evaluating|Stack dump" build-$T.log | sed 's#/Users/runner/work/Compositor/Compositor/##' | cut -c1-250 | awk '!seen[$0]++' | head -15 | tee -a errors.txt
              while IFS= read -r line; do echo "::error::[$T] $line"; done < <(grep -E "error:|While running pass" build-$T.log | sed 's#/Users/runner/work/Compositor/Compositor/##' | cut -c1-250 | awk '!seen[$0]++' | head -5)
            fi
          done
          test -f target.txt

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log

      - name: Ad-hoc sign and package DMG
        run: |
          T=$(cat target.txt)
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          echo "Built: $APP for macOS $T+"
          codesign --force --deep --sign - "$APP"
          mkdir dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Compositor" -srcfolder dmgroot -ov -format UDZO "Compositor-macos$T-plus.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Compositor-dmg
          path: Compositor-macos*-plus.dmg
